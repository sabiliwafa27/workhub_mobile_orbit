name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      operation:
        description: Shorebird operation
        type: choice
        options: [ release, patch ]
        default: release
      release_version:
        description: Existing Shorebird release version for a patch (for example 1.0.0+42, or latest)
        required: false
        default: latest

permissions:
  contents: write

jobs:
  build:
    name: Test and build Android app
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Flutter environment
        run: flutter doctor -v

      - name: Generate missing platform files
        run: flutter create . --org net.kecapsawi --project-name workhub_mobile --platforms android,ios

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36"

      - name: Patch Gradle repositories and lint settings
        run: |
          if [ -f android/settings.gradle.kts ]; then
            sed -i '/pluginManagement {/a \    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }' android/settings.gradle.kts
          fi
          if [ -f android/settings.gradle ]; then
            sed -i '/pluginManagement {/a \    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }' android/settings.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
            grep -Eq 'compileSdk = 36' android/app/build.gradle.kts || { echo 'Could not set Android compileSdk to 36.' >&2; exit 1; }
            printf '\nandroid {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }\n}\n' >> android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
            grep -Eq 'compileSdkVersion 36' android/app/build.gradle || { echo 'Could not set Android compileSdk to 36.' >&2; exit 1; }
            printf '\nandroid {\n    lintOptions {\n        checkReleaseBuilds false\n        abortOnError false\n    }\n}\n' >> android/app/build.gradle
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test --no-pub

      - name: Build verification APK for pull requests
        if: github.event_name == 'pull_request'
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Set up Shorebird
        if: github.event_name != 'pull_request'
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Configure Shorebird app
        if: github.event_name != 'pull_request'
        env:
          SHOREBIRD_APP_ID: ${{ secrets.SHOREBIRD_APP_ID }}
        run: |
          if [ -z "$SHOREBIRD_APP_ID" ]; then
            echo 'Configure the SHOREBIRD_APP_ID repository secret before releasing.' >&2
            exit 1
          fi
          printf 'app_id: %s\n' "$SHOREBIRD_APP_ID" > shorebird.yaml
          if ! rg -q '^  assets:' pubspec.yaml; then
            sed -i '/^  uses-material-design: true$/a\  assets:\n    - shorebird.yaml' pubspec.yaml
          fi
          flutter pub get

      - name: Create Shorebird release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'release')
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          if [ -z "$SHOREBIRD_TOKEN" ]; then
            echo 'Configure the SHOREBIRD_TOKEN repository secret before releasing.' >&2
            exit 1
          fi
          shorebird release android --artifact apk --target-platform android-arm64 --build-number "$GITHUB_RUN_NUMBER"

      - name: Publish Shorebird APK release
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.operation == 'release')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: WorkHub Mobile v1.0.${{ github.run_number }}
          body: |
            Shorebird-enabled ARM64 release. Future Dart and Flutter UI fixes can be delivered as OTA patches.
            Commit: ${{ github.sha }}
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply Shorebird patch
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'patch'
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [ -z "$SHOREBIRD_TOKEN" ]; then
            echo 'Configure the SHOREBIRD_TOKEN repository secret before patching.' >&2
            exit 1
          fi
          shorebird patch android --release-version "$RELEASE_VERSION" --track stable
