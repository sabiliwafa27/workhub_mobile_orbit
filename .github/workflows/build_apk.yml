name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Flutter & Environment
        run: flutter doctor -v

      - name: Generate Missing Platform Files
        run: flutter create . --org net.kecapsawi --project-name workhub_mobile --platforms android,ios

      - name: Patch Gradle Plugin Portal & MavenCentral
        run: |
          if [ -f android/settings.gradle.kts ]; then
            sed -i '/pluginManagement {/a \    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }' android/settings.gradle.kts
          fi
          if [ -f android/settings.gradle ]; then
            sed -i '/pluginManagement {/a \    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }' android/settings.gradle
          fi
          # Disable lintVitalAnalyzeRelease to prevent ExifDataCopier NoSuchMethodError in AGP lint
          if [ -f android/app/build.gradle.kts ]; then
            echo -e "\nandroid {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }\n}" >> android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            echo -e "\nandroid {\n    lintOptions {\n        checkReleaseBuilds false\n        abortOnError false\n    }\n}" >> android/app/build.gradle
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Build arm64 Release APK
        shell: bash
        run: |
          set -o pipefail
          build_log="$(mktemp)"
          trap 'rm -f "$build_log"' EXIT
          for attempt in 1 2 3; do
            if flutter build apk --release --target-platform android-arm64 --split-per-abi 2>&1 | tee "$build_log"; then
              exit 0
            fi
            if ! grep -Eq '429|Too Many Requests' "$build_log" || [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            delay=$((attempt * 60))
            echo "Dependency repository rate limited the build; retrying in ${delay}s."
            sleep "$delay"
          done

      - name: Create Git Release & Upload APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: WorkHub Mobile v1.0.${{ github.run_number }}
          body: |
            Automated build for WorkHub Mobile APK (ARM64).
            Commit: ${{ github.sha }}
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
