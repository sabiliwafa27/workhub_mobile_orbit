name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      operation:
        description: Shorebird operation
        type: choice
        options: [ release, patch ]
        default: release
      release_version:
        description: Existing Shorebird release version for a patch (for example 1.0.42+42, or latest)
        required: false
        default: latest

permissions:
  contents: write

jobs:
  build:
    name: Test and build Android app
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Flutter environment
        run: flutter doctor -v

      - name: Generate missing platform files
        run: flutter create . --org net.kecapsawi --project-name workhub_mobile --platforms android,ios

      - name: Install Android API 36
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          sdkmanager_path="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager_path" ] && [ -d "$sdk_root/cmdline-tools" ]; then
            sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          if [ -z "$sdkmanager_path" ] || [ ! -x "$sdkmanager_path" ]; then
            echo "Android SDK manager was not found under $sdk_root/cmdline-tools." >&2
            exit 1
          fi
          "$sdkmanager_path" "platforms;android-36"

      - name: Patch Gradle repositories and lint settings
        run: |
          if [ -f android/settings.gradle.kts ]; then
            sed -i '/pluginManagement {/a \    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }' android/settings.gradle.kts
          fi
          if [ -f android/settings.gradle ]; then
            sed -i '/pluginManagement {/a \    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }' android/settings.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E 's/^([[:space:]]*)compileSdk[[:space:]]*=.*/\1compileSdk = 36/' android/app/build.gradle.kts
            grep -Eq '^[[:space:]]*compileSdk[[:space:]]*=[[:space:]]*36([[:space:]]|$)' android/app/build.gradle.kts || {
              echo 'Could not set Android compileSdk to 36 in android/app/build.gradle.kts.' >&2
              cat android/app/build.gradle.kts >&2
              exit 1
            }
            printf '\nandroid {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }\n}\n' >> android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i -E 's/^([[:space:]]*)compileSdkVersion([[:space:]]+|[[:space:]]*=).*/\1compileSdkVersion 36/' android/app/build.gradle
            grep -Eq '^[[:space:]]*compileSdkVersion[[:space:]]+36([[:space:]]|$)' android/app/build.gradle || {
              echo 'Could not set Android compileSdk to 36 in android/app/build.gradle.' >&2
              cat android/app/build.gradle >&2
              exit 1
            }
            printf '\nandroid {\n    lintOptions {\n        checkReleaseBuilds false\n        abortOnError false\n    }\n}\n' >> android/app/build.gradle
          else
            echo 'Flutter did not generate an Android app Gradle build file.' >&2
            exit 1
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Verify file_picker Android SDK compatibility
        run: |
          file_picker_version="$(awk '/^  file_picker:$/ { found = 1; next } found && /version:/ { gsub(/"/, "", $2); print $2; exit }' pubspec.lock)"
          minimum_version="10.3.3"
          if [ -z "$file_picker_version" ] || [ "$(printf '%s\n' "$minimum_version" "$file_picker_version" | sort -V | head -n1)" != "$minimum_version" ]; then
            echo "file_picker $file_picker_version is too old; Android API 36 support requires file_picker >= $minimum_version." >&2
            exit 1
          fi
          echo "Resolved file_picker $file_picker_version (Android compileSdk follows the Flutter SDK)."

      - name: Run Flutter tests
        run: flutter test --no-pub

      - name: Build verification APK for pull requests
        if: github.event_name == 'pull_request'
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi --build-name "1.0.$GITHUB_RUN_NUMBER" --build-number "$GITHUB_RUN_NUMBER"

      - name: Set up Shorebird
        if: github.event_name != 'pull_request'
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Configure Shorebird app
        id: shorebird-config
        if: github.event_name != 'pull_request'
        env:
          SHOREBIRD_APP_ID: ${{ secrets.SHOREBIRD_APP_ID }}
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          if [ -z "$SHOREBIRD_APP_ID" ] || [ -z "$SHOREBIRD_TOKEN" ]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo 'Manual Shorebird release or patch requires SHOREBIRD_APP_ID and SHOREBIRD_TOKEN repository secrets.' >&2
              exit 1
            fi
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Shorebird secrets are not configured; building a standard APK.'
            exit 0
          fi
          echo 'enabled=true' >> "$GITHUB_OUTPUT"
          printf 'app_id: %s\n' "$SHOREBIRD_APP_ID" > shorebird.yaml
          if ! rg -q '^  assets:' pubspec.yaml; then
            sed -i '/^  uses-material-design: true$/a\  assets:\n    - shorebird.yaml' pubspec.yaml
          fi
          flutter pub get

      - name: Create Shorebird release
        if: (github.event_name == 'push' && steps.shorebird-config.outputs.enabled == 'true') || (github.event_name == 'workflow_dispatch' && inputs.operation == 'release')
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          if [ -z "$SHOREBIRD_TOKEN" ]; then
            echo 'Configure the SHOREBIRD_TOKEN repository secret before releasing.' >&2
            exit 1
          fi
          shorebird release android --artifact apk --target-platform android-arm64 --build-name "1.0.$GITHUB_RUN_NUMBER" --build-number "$GITHUB_RUN_NUMBER"

      - name: Publish Shorebird APK release
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.shorebird-config.outputs.enabled == 'true') || (github.event_name == 'workflow_dispatch' && inputs.operation == 'release')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: WorkHub Mobile v1.0.${{ github.run_number }}
          body: |
            Shorebird-enabled ARM64 release. Future Dart and Flutter UI fixes can be delivered as OTA patches.
            Commit: ${{ github.sha }}
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build standard APK without Shorebird
        if: github.event_name == 'push' && steps.shorebird-config.outputs.enabled != 'true'
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi --build-name "1.0.$GITHUB_RUN_NUMBER" --build-number "$GITHUB_RUN_NUMBER"

      - name: Publish standard APK release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.shorebird-config.outputs.enabled != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: WorkHub Mobile v1.0.${{ github.run_number }}
          body: |
            ARM64 APK built without Shorebird. Configure SHOREBIRD_APP_ID and SHOREBIRD_TOKEN to enable OTA releases.
            Commit: ${{ github.sha }}
          files: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply Shorebird patch
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'patch'
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [ -z "$SHOREBIRD_TOKEN" ]; then
            echo 'Configure the SHOREBIRD_TOKEN repository secret before patching.' >&2
            exit 1
          fi
          shorebird patch android --release-version "$RELEASE_VERSION" --track stable
